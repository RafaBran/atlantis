spring.application.name=atlantis-backend

# Conexão com o PostgreSQL do docker-compose (senha vem do .env, nunca do repositório)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/atlantis}
spring.datasource.username=${DB_USERNAME:atlantis}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.open-in-view=false
